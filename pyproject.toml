
[project]
name = "genai-deployment-lab"
version = "0.1.0"
description = "CPU-based open-weight generative AI deployment on Google Cloud Run"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "transformers",
    "torch",
]

[tool.uv]
package = false


[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
